name: Build libretro core

# vita3k_libretro (.so / .dll), built with -DBUILD_LIBRETRO=ON on the same
# runners, dependencies and presets upstream builds Vita3K with. Each artifact
# holds the core and system/vita3k/, the data, lang and builtin shaders the
# core looks for in RetroArch's system directory.

on:
  workflow_dispatch:
  push:
    branches: [libretro]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runs_on: ubuntu-latest
            artifact: vita3k_libretro-linux-x86_64
            preset: linux-ninja-clang
          - name: Linux aarch64
            runs_on: ubuntu-24.04-arm
            artifact: vita3k_libretro-linux-aarch64
            preset: linux-ninja-clang
          - name: Windows x86_64
            runs_on: windows-latest
            artifact: vita3k_libretro-windows-x86_64
            preset: windows-ninja
            vcpkg_triplet: x64-windows-static-md
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:mhier/libboost-latest
          sudo add-apt-repository universe
          sudo apt update
          sudo apt -y install ccache libboost-filesystem1.83-dev libboost-program-options1.83-dev libboost-system1.83-dev ninja-build clang lld

      - name: Set up build environment (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib boost-system boost-filesystem boost-program-options boost-icl boost-variant curl openssl --triplet=${{ matrix.vcpkg_triplet }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = Windows ]; then
            extra="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}"
          fi
          cmake --preset ${{ matrix.preset }} -DBUILD_LIBRETRO=ON $extra

      - name: Build
        shell: bash
        run: cmake --build build/${{ matrix.preset }} --config Release --target vita3k_libretro

      - name: Collect
        shell: bash
        run: |
          core=$(find build/${{ matrix.preset }} -name 'vita3k_libretro.so' -o -name 'vita3k_libretro.dll' | grep -i release | head -1)
          [ -n "$core" ] || core=$(find build/${{ matrix.preset }} -name 'vita3k_libretro.so' -o -name 'vita3k_libretro.dll' | head -1)
          echo "core: $core"
          mkdir -p dist/cores dist/system/vita3k
          cp "$core" dist/cores/
          cp -r data lang dist/system/vita3k/
          cp -r vita3k/shaders-builtin dist/system/vita3k/
          ls -la dist/cores
          if [ "$RUNNER_OS" = Linux ]; then
            strip --strip-unneeded dist/cores/vita3k_libretro.so
            readelf -d dist/cores/vita3k_libretro.so | grep NEEDED
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
