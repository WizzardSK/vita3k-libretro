name: Build libretro core

# vita3k_libretro (.so / .dll), built with -DBUILD_LIBRETRO=ON on the same
# runners, dependencies and presets upstream builds Vita3K with. Each artifact
# holds the core and system/vita3k/, the data and builtin shaders the
# core looks for in RetroArch's system directory.

on:
  workflow_dispatch:
  push:
    branches: [libretro]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runs_on: ubuntu-24.04
            artifact: vita3k_libretro-linux-x86_64
            preset: linux-ninja-clang
          - name: Linux aarch64
            runs_on: ubuntu-24.04-arm
            artifact: vita3k_libretro-linux-aarch64
            preset: linux-ninja-clang
          - name: Windows x86_64
            runs_on: windows-latest
            artifact: vita3k_libretro-windows-x86_64
            preset: windows-ninja
            vcpkg_triplet: x64-windows-static-md
          # The core alone, built with CMake and the NDK as upstream's gradle
          # build does for the app; the libraries from vcpkg, as upstream
          - name: Android arm64
            runs_on: ubuntu-latest
            artifact: vita3k_libretro-android-arm64
            android: true
            android_abi: arm64-v8a
            vcpkg_triplet: arm64-android
          - name: Android x86_64
            runs_on: ubuntu-latest
            artifact: vita3k_libretro-android-x86_64
            android: true
            android_abi: x86_64
            vcpkg_triplet: x64-android
          # Upstream's macOS presets: Apple clang, Boost and OpenSSL built here;
          # x86_64 cross-built on the arm64 runner, as upstream does
          - name: macOS arm64
            runs_on: macos-15
            artifact: vita3k_libretro-macos-arm64
            preset: ci-macos-arm64
          - name: macOS x86_64
            runs_on: macos-15
            artifact: vita3k_libretro-macos-x86_64
            preset: ci-macos-x64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up build environment (Linux)
        if: runner.os == 'Linux' && !matrix.android
        run: |
          # Ubuntu 24.04, for glibc 2.39: a core built on 26.04 needs glibc 2.43
          # and does not load on most systems. Vita3K is C++23 (std::expected),
          # which 24.04's clang 18 cannot build, so clang 20 comes from
          # apt.llvm.org. Boost is built from its submodule. The X11/Wayland
          # headers are for the SDL subproject, which configures even though the
          # core opens no window.
          sudo apt update
          sudo apt -y install ccache ninja-build lld g++ wget lsb-release software-properties-common gnupg \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev libdbus-1-dev
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          clang++-20 --version | head -1

      - name: Set up build environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache ninja >/dev/null
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"

      - name: Set up build environment (Android)
        if: matrix.android
        run: |
          sudo apt-get install -y ninja-build
          ndk=27.3.13750724
          [ -d "$ANDROID_SDK_ROOT/ndk/$ndk" ] || yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ndk" >> $GITHUB_ENV
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ndk
          # The libraries come from vcpkg.json (manifest mode), installed when
          # CMake configures

      # vcpkg builds the libraries of vcpkg.json when CMake configures - Boost,
      # OpenSSL, curl - which starved the Windows runner until it lost contact
      # with GitHub. Its binary cache keeps them between runs, and the build is
      # held to two jobs at a time.
      - name: vcpkg cache
        if: runner.os == 'Windows' || matrix.android
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.vcpkg_triplet }}-

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        shell: bash
        env:
          VCPKG_MAX_CONCURRENCY: 2
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          extra=""
          if [ "$RUNNER_OS" = Windows ]; then
            # The static OpenSSL build wants a native Windows Perl, and the
            # first perl on the path is Git's (cygwin)
            extra="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} -DPERL_EXECUTABLE=C:/Strawberry/perl/bin/perl.exe"
          fi
          if [ "${{ matrix.android }}" = true ]; then
            cmake -B build/android -G Ninja -DCMAKE_SYSTEM_NAME=Android -DANDROID_ABI=${{ matrix.android_abi }} \
              -DANDROID_PLATFORM=android-28 -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_LIBRETRO=ON
            exit 0
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            # Everything into one shared object: position-independent code, and
            # the core's own symbols bound inside it, which also lets the
            # prebuilt ffmpeg's assembly and the static libstdc++ link. Boost is
            # built here with -fPIC: Ubuntu's static one is not position-independent
            extra="-DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_LINKER_TYPE=LLD -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-Bsymbolic -DVITA3K_FORCE_CUSTOM_BOOST=ON"
          fi
          cmake --preset ${{ matrix.preset }} -DBUILD_LIBRETRO=ON $extra

      - name: Build
        shell: bash
        run: cmake --build build/${{ matrix.preset || 'android' }} --config Release --target vita3k_libretro

      - name: Collect
        shell: bash
        run: |
          dir=build/${{ matrix.preset || 'android' }}
          core=$(find $dir -name 'vita3k_libretro.so' -o -name 'vita3k_libretro.dll' -o -name 'vita3k_libretro.dylib' | { grep -i release || true; } | head -1)
          [ -n "$core" ] || core=$(find $dir -name 'vita3k_libretro.so' -o -name 'vita3k_libretro.dll' -o -name 'vita3k_libretro.dylib' | head -1)
          echo "core: $core"
          mkdir -p dist/cores dist/system/vita3k
          cp "$core" dist/cores/
          # The core before stripping, for reading crash backtraces from users
          mkdir -p symbols && cp "$core" symbols/
          cp -r data dist/system/vita3k/
          cp -r vita3k/shaders-builtin dist/system/vita3k/
          # The core info, for RetroArch to load content with the core before
          # it is loaded
          mkdir -p dist/info
          # RetroArch names it after the core without the platform: also
          # vita3k_libretro.info for vita3k_libretro_android.so (sco)
          cp vita3k_libretro.info dist/info/
          ls -la dist/cores
          if [ "${{ matrix.android }}" = true ]; then
            mv dist/cores/vita3k_libretro.so dist/cores/vita3k_libretro_android.so
            $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded dist/cores/vita3k_libretro_android.so
            $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d dist/cores/vita3k_libretro_android.so | grep NEEDED
          elif [ "$RUNNER_OS" = Linux ]; then
            strip --strip-unneeded dist/cores/vita3k_libretro.so
            readelf -d dist/cores/vita3k_libretro.so | grep NEEDED
          elif [ "$RUNNER_OS" = macOS ]; then
            strip -x dist/cores/vita3k_libretro.dylib
            codesign -f -s - dist/cores/vita3k_libretro.dylib
            otool -L dist/cores/vita3k_libretro.dylib
            lipo -info dist/cores/vita3k_libretro.dylib
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-symbols
          path: symbols/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
